name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        type: choice
        required: true
        default: all
        options:
          - all
          - token-verdict-mcp
          - route-verdict-mcp
          - list-smith-mcp

jobs:
  publish-token-verdict:
    if: inputs.package == 'all' || inputs.package == 'token-verdict-mcp'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build token-verdict-mcp
        working-directory: mcp
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish token-verdict-mcp
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp/dist

  publish-route-verdict:
    if: inputs.package == 'all' || inputs.package == 'route-verdict-mcp'
    runs-on: ubuntu-latest
    environment: route-verdict
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build route-verdict-mcp
        working-directory: mcp-route-verdict
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish route-verdict-mcp
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-route-verdict/dist

  publish-list-smith:
    if: inputs.package == 'all' || inputs.package == 'list-smith-mcp'
    runs-on: ubuntu-latest
    environment: list-smith
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build list-smith-mcp
        working-directory: mcp-list-smith
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish list-smith-mcp
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-list-smith/dist
